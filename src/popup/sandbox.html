<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Turnstile Verification Sandbox</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      min-height: 65px;
    }
    #cf-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }
  </style>
  <script>
    let widgetId = null;

    window.addEventListener('message', function(event) {
      const data = event.data;
      if (!data) return;

      if (data.action === 'RENDER_TURNSTILE') {
        // Remote Cloudflare Turnstile script is removed to strictly comply with MV3 CSP.
        // Notify parent that API Key authentication should be configured.
        window.parent.postMessage({
          type: 'TURNSTILE_ERROR',
          errorCode: 'Cloudflare Turnstile không được hỗ trợ trong môi trường tiện ích MV3 (vi phạm CSP script ngoài). Vui lòng sử dụng API Key trong cài đặt.'
        }, '*');
      }

      if (data.action === 'RESET_TURNSTILE') {
        widgetId = null;
      }
    });
  </script>
</head>
<body>
  <div id="cf-container"></div>
</body>
</html>
