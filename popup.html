<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Video Tools</title>
  <script type="module" crossorigin src="./popup.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <img src="icons/icon-48.png" alt="X Video Tools" class="popup-logo" width="32" height="32">
      <div class="popup-title-group">
        <h1 class="popup-title">X Video Tools</h1>
        <span class="popup-badge">v0.1.0</span>
      </div>
    </header>
    <main class="popup-body">
      <div class="status-card">
        <span class="status-indicator"></span>
        <span class="status-text">Phase 0: Project Initialized</span>
      </div>
      <p class="popup-description">
        Tiện ích tải video X (Twitter) trực tiếp qua Cobalt API &amp; CDN Twimg.
      </p>
    </main>
  </div>
</body>
</html>
